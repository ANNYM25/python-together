[project]
name = "python-together"
version = "0.1.0"
description = "Shared Python, math, ML, and fintech lab"
requires-python = ">=3.11"
readme = "README.md"

# Lessons are notebooks. Each one self-verifies with inline `assert` checks, and
# CI executes every notebook, so a wrong implementation fails the build. The
# jupytext block below is only for the optional authoring workflow in tools/.
[tool.jupytext]
formats = "py:percent,ipynb"
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"
